services:
  backend:
    container_name: sms_backend_dev
    build:
      context: ./backend
    restart: always
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "8000"
      FLASK_DEBUG: ${FLASK_DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-dev-secret-string}
      POSTGRES_HOST: ${POSTGRES_HOST:-global_postgres}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisStrongPassword123!}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SUPER_ADMIN_DATABASE_URL: ${SUPER_ADMIN_DATABASE_URL:-postgresql://admin:ChangeThisStrongPassword123!@global_postgres:5432/sms_dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://dev-sms.klopterz.in}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:-gpt-4.1-mini}
      AZURE_OPENAI_API_URL: ${AZURE_OPENAI_API_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.1-pro-preview}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.2-90b-vision-preview}
      GROQ_API_URL: ${GROQ_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_MODEL: ${CLOUDFLARE_MODEL:-@cf/meta/llama-3.2-90b-vision-instruct}
      # Keep this optional: backend derives default from CLOUDFLARE_ACCOUNT_ID when unset.
      CLOUDFLARE_API_URL: ${CLOUDFLARE_API_URL}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-azure,groq,gemini,cloudflare}
      HOMEWORK_UPLOAD_DIR: ${HOMEWORK_UPLOAD_DIR:-/app/uploads/homework}
      APP_PORT: "8000"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - app-network

  frontend:
    container_name: sms_frontend_dev
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NPM_TOKEN: ${NPM_TOKEN:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - app-network

networks:
  app-network:
    external: true
