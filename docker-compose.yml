services:
  backend:
    container_name: sms_backend_dev
    build:
      context: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://admin:ChangeThisStrongPassword123!@global_postgres:5432/sms_dev
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_MODULE: ${APP_MODULE:-main:app}
      APP_PORT: "8000"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://dev-sms.klopterz.in}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - app-network

  frontend:
    container_name: sms_frontend_dev
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - app-network

networks:
  app-network:
    external: true
