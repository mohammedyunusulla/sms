server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Installed app (PWA): the service worker, manifest and index.html must always be
    # revalidated, otherwise users keep an old build after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed bundles never change content under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
